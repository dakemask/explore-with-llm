<title>分支配色预览</title>
<style>
/* Layout: a compact control bar on top, the horizontal tree fills the rest of the screen. */
:root {
  --bg: #fbfbfa; --surface: #ffffff; --subtle: #efefec; --border: #e6e5e1; --border-strong: #d4d3ce;
  --fg: #1f1f1d; --muted: #6b6a66; --faint: #9d9c97; --accent: #4f46e5;
  --hover: rgb(0 0 0 / 0.07); --band: rgb(40 40 20 / 0.11); --casing: #3a3936;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 8px 24px -6px rgb(0 0 0 / 0.12);
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a19; --surface: #222221; --subtle: #2a2a28; --border: #2f2f2d; --border-strong: #3d3d3a;
    --fg: #ecebe8; --muted: #a3a29d; --faint: #75746f; --accent: #818cf8;
    --hover: rgb(255 255 255 / 0.09); --band: rgb(255 255 240 / 0.16); --casing: #e8e7e3;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px -6px rgb(0 0 0 / 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1a19; --surface: #222221; --subtle: #2a2a28; --border: #2f2f2d; --border-strong: #3d3d3a;
  --fg: #ecebe8; --muted: #a3a29d; --faint: #75746f; --accent: #818cf8;
  --hover: rgb(255 255 255 / 0.09); --band: rgb(255 255 240 / 0.16); --casing: #e8e7e3;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px -6px rgb(0 0 0 / 0.5);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.6; }
.app { height: 100%; display: flex; flex-direction: column; padding-inline: 20px; padding-block: 16px; gap: 12px; box-sizing: border-box; }
.top { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
h1 { font-size: 17px; font-weight: 650; margin: 0; }
.seg { display: inline-flex; background: var(--subtle); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 4px 12px; border-radius: 7px; cursor: pointer; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); font-weight: 550; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.sw { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.sw i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.desc { margin: 0; color: var(--muted); font-size: 13px; max-width: 110ch; }
.stage { flex: 1; min-height: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: auto; display: grid; }
.stage svg { margin: auto; display: block; }
.tnode { cursor: pointer; }
.tnode:hover .halo { opacity: 1; }
.core { transition: transform 0.1s ease-out; transition-delay: var(--delay, 0ms); transform-box: fill-box; transform-origin: center; }
.lit .core { transform: scale(1.2); }
.group-label { font-size: 12px; color: var(--faint); }
.group { display: inline-flex; align-items: center; gap: 8px; }
svg text { font-family: var(--font); }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 9px; padding: 6px 10px; font-size: 12.5px; }
</style>

<div class="app">
  <div class="top">
    <h1>分支配色预览 · 彩虹流</h1>
    <div class="seg" id="themes"></div>
    <div class="group"><span class="group-label">悬停效果</span><div class="seg" id="modes"></div></div>
    <div class="swatches" id="swatches"></div>
  </div>
  <p class="desc">树打开后位置固定，不随点击变化。带黑圈和“当前”标签的是你所在的节点。悬停任意节点，从起点到它的路会从左往右延伸着标出来；在相邻节点间移动时，相同的前半段不重画。点击节点只移动“当前”标识（在应用里就是跳到那里）。只画末端的尝试（灰圈）。</p>
  <div class="stage" id="stage"></div>
</div>
<div class="tip" id="tip" hidden></div>

<script>
// ---------- sample tree ----------
// A chain of `len` nodes. forks[i]: extra branches off the node before chain node i (siblings of chain node i,
// newer than it). att[i]: extra retries (attempt siblings) of chain node i. end: the last message was tried
// this many times in all (the chain's last node and its siblings are attempts).
const SPEC = {
  len: 28,
  att: { 5: 1, 11: 2 },
  forks: {
    3: [{ len: 6, end: 2 }],
    8: [
      { len: 11, forks: { 4: [{ len: 5 }, { len: 3, end: 2 }] }, att: { 7: 1 } },
      { len: 4 },
    ],
    14: [
      { len: 8, forks: { 3: [{ len: 3 }] } },
      { len: 2 },
      { len: 6, end: 3 },
      { len: 3 },
    ],
    19: [
      { len: 10, forks: { 5: [{ len: 5, forks: { 3: [{ len: 2 }, { len: 3, end: 2 }] } }] } },
    ],
    23: [{ len: 4 }, { len: 2 }],
  },
  end: 3,
}

function build() {
  const nodes = []
  let n = 0
  const mk = (parent, k) => { const node = { id: 'n' + n++, parent, k }; nodes.push(node); return node }
  const chain = (spec, parent) => {
    const ids = []
    let p = parent
    for (let i = 1; i <= spec.len; i++) {
      const node = mk(p, i === spec.len && spec.end ? 't' : 'b')
      ids.push(node)
      p = node.id
    }
    for (let i = 1; i <= spec.len; i++) {
      const par = i === 1 ? parent : ids[i - 2].id
      for (let a = 0; a < (spec.att?.[i] ?? 0); a++) mk(par, 't')
      for (const sub of spec.forks?.[i] ?? []) chain(sub, par)
    }
    if (spec.end) for (let a = 1; a < spec.end; a++) mk(spec.len === 1 ? parent : ids[spec.len - 2].id, 't')
  }
  chain(SPEC, null)
  return nodes
}
const ALL = build()
const KIDS = new Map()
for (const n of ALL) { const k = n.parent ?? 'root'; if (!KIDS.has(k)) KIDS.set(k, []); KIDS.get(k).push(n) }
const kids = (pid) => KIDS.get(pid ?? 'root') ?? []
const BY_ID = new Map(ALL.map((n) => [n.id, n]))

// ---------- colors: rainbow flow over 7 colors ----------
const RAINBOW = [
  { n: '红', h: 27, l: 0.62, c: 0.2 }, { n: '橙', h: 55, l: 0.72, c: 0.17 }, { n: '黄', h: 92, l: 0.83, c: 0.16 },
  { n: '绿', h: 150, l: 0.66, c: 0.17 }, { n: '青', h: 205, l: 0.68, c: 0.12 }, { n: '蓝', h: 258, l: 0.58, c: 0.17 },
  { n: '紫', h: 300, l: 0.55, c: 0.19 },
]
const GREY = -1
function computeColors() {
  const col = new Map()
  ;(function walk(pid, pc) {
    const ch = kids(pid), br = ch.filter((n) => n.k === 'b'), fork = br.length >= 2
    let bi = 0
    for (const n of ch) {
      // The branches at a fork take the next colors along the rainbow, top to bottom.
      const c = n.k === 't' ? (ch.length > 1 ? GREY : pc) : fork ? (pc + ++bi) % RAINBOW.length : pc
      col.set(n.id, c)
      walk(n.id, c)
    }
  })(null, 0)
  return col
}
function isDark() {
  const t = document.documentElement.dataset.theme
  if (t) return t === 'dark'
  return matchMedia('(prefers-color-scheme: dark)').matches
}
function css(c) {
  const dark = isDark()
  if (c === GREY) return dark ? 'oklch(0.48 0 0)' : 'oklch(0.78 0 0)'
  const r = RAINBOW[c]
  return `oklch(${(dark ? Math.min(0.86, r.l + 0.06) : r.l).toFixed(3)} ${r.c} ${r.h})`
}

// ---------- units: what the map draws ----------
// Branches each get a circle. Attempts are drawn only at the end, where a fork has nothing but attempts; they
// stack into one circle. Attempts next to branches aren't drawn.
function unitsOf(pid) {
  const ch = kids(pid), br = ch.filter((n) => n.k === 'b')
  if (br.length) return br.map((n) => ({ id: n.id, type: 'node', nodes: [n], parent: pid }))
  if (ch.length === 1) return [{ id: ch[0].id, type: 'node', nodes: ch, parent: pid }]
  if (ch.length > 1) return [{ id: 'stack-' + pid, type: 'stack', nodes: ch, parent: pid }]
  return []
}

// ---------- tidy layout ----------
// Each subtree is laid out on its own and described by its contour: for every column, the highest and lowest
// row it uses. Siblings are stacked top to bottom, each pushed down just enough that its contour clears the ones
// above by a row, and the parent sits halfway between its first and last child. Positions never change after.
function tidy(u) {
  const ch = u.type === 'node' ? unitsOf(u.id) : []
  u.children = ch
  if (!ch.length) return { top: [0], bot: [0] }
  const accTop = [], accBot = []
  ch.forEach((c, i) => {
    const s = tidy(c)
    let shift = 0
    if (i > 0) {
      shift = -Infinity
      for (let d = 0; d < s.top.length && d < accBot.length; d++) shift = Math.max(shift, accBot[d] - s.top[d] + 1)
    }
    c.rel = shift
    for (let d = 0; d < s.top.length; d++) {
      accTop[d] = Math.min(accTop[d] ?? Infinity, s.top[d] + shift)
      accBot[d] = Math.max(accBot[d] ?? -Infinity, s.bot[d] + shift)
    }
  })
  const mid = (ch[0].rel + ch[ch.length - 1].rel) / 2
  for (const c of ch) c.rel -= mid
  return { top: [0, ...accTop.map((v) => v - mid)], bot: [0, ...accBot.map((v) => v - mid)] }
}

const ROOTS = unitsOf(null)
const PLACED = new Map()
;(function layout() {
  let base = 0
  for (const r of ROOTS) {
    const s = tidy(r)
    const place = (u, col, row) => { PLACED.set(u.id, { u, col, row }); for (const c of u.children) place(c, col + 1, row + c.rel) }
    place(r, 0, base - Math.min(...s.top))
    base += Math.max(...s.bot) - Math.min(...s.top) + 1
  }
})()

// ---------- render ----------
const GX = 34, GY = 22, PAD = 30
const stage = document.getElementById('stage')
const tip = document.getElementById('tip')
let current = 'stack-' + ALL.find((n) => n.k === 't').parent

function pathTo(id) {
  const ids = new Set()
  for (let cur = PLACED.get(id); cur; cur = cur.u.parent ? PLACED.get(cur.u.parent) : null) ids.add(cur.u.id)
  return ids
}

function seg(el, items, cur, onPick) {
  el.innerHTML = ''
  items.forEach((label, i) => {
    const b = document.createElement('button')
    b.textContent = label
    b.setAttribute('aria-pressed', String(i === cur))
    b.onclick = () => onPick(i)
    el.appendChild(b)
  })
}

function render() {
  seg(document.getElementById('modes'), MODES, mode, (i) => { mode = i; render() })
  seg(document.getElementById('themes'), ['浅色', '深色'], isDark() ? 1 : 0, (i) => { document.documentElement.dataset.theme = i ? 'dark' : 'light'; render() })
  const sw = document.getElementById('swatches')
  sw.innerHTML = ''
  RAINBOW.forEach((r, i) => { const s = document.createElement('span'); s.className = 'sw'; s.innerHTML = `<i style="background:${css(i)}"></i>`; s.append(r.n); sw.appendChild(s) })

  const col = computeColors()
  let minRow = Infinity, maxRow = -Infinity, maxCol = 0
  for (const p of PLACED.values()) { minRow = Math.min(minRow, p.row); maxRow = Math.max(maxRow, p.row); maxCol = Math.max(maxCol, p.col) }
  const W = PAD * 2 + maxCol * GX + 30, H = PAD * 2 + (maxRow - minRow) * GY + 16
  const X = (p) => PAD + p.col * GX, Y = (p) => PAD + 16 + (p.row - minRow) * GY
  let defs = '', edges = '', nodes = ''
  EDGES.clear()
  for (const p of PLACED.values()) {
    const u = p.u, c = css(col.get(u.nodes[0].id))
    const parent = u.parent && PLACED.get(u.parent)
    if (parent) {
      const pc = css(col.get(parent.u.nodes[0].id))
      const x1 = X(parent), y1 = Y(parent), x2 = X(p), y2 = Y(p)
      let stroke = c
      if (pc !== c) {
        // Where the color changes, the line flows from the parent's color into the branch's.
        defs += `<linearGradient id="gr-${u.id}" gradientUnits="userSpaceOnUse" x1="${x1}" y1="0" x2="${x2}" y2="0"><stop offset="0.1" stop-color="${pc}"/><stop offset="0.9" stop-color="${c}"/></linearGradient>`
        stroke = `url(#gr-${u.id})`
      }
      const d = y1 === y2 ? `M${x1} ${y1} L${x2} ${y2}` : `M${x1} ${y1} C${x1 + GX * 0.6} ${y1} ${x2 - GX * 0.6} ${y2} ${x2} ${y2}`
      edges += `<path class="edge" data-id="${u.id}" d="${d}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round"/>`
      EDGES.set(u.id, { d, stroke })
    }
    const x = X(p), y = Y(p), here = u.id === current
    let g = `<g class="tnode" data-id="${u.id}" transform="translate(${x} ${y})"><circle class="halo" r="11" fill="var(--hover)" opacity="0"/>`
    if (u.type === 'stack') {
      g += `<circle cx="3.5" cy="-3" r="5.5" fill="${c}" opacity="0.55"/><circle r="5.5" fill="${c}" stroke="var(--surface)" stroke-width="1.5"/>`
      g += `<text x="10" y="4" font-size="10.5" fill="var(--muted)">×${u.nodes.length}</text>`
    } else g += `<circle class="core" r="5" fill="${c}"/>`
    if (here) g += `<circle r="9.5" fill="none" stroke="var(--fg)" stroke-width="2"/><g transform="translate(0 -16)"><rect x="-17" y="-10" width="34" height="17" rx="8.5" fill="var(--fg)"/><text y="3" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--surface)">当前</text></g>`
    nodes += g + '</g>'
  }
  stage.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="对话树图"><defs>${defs}` +
    `<mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><path id="reveal-path" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/></mask></defs>` +
    `<g id="under" mask="url(#reveal)"></g><g>${edges}</g><g id="over" mask="url(#reveal)"></g><g>${nodes}</g></svg>`
  const svg = stage.querySelector('svg')
  for (const el of svg.querySelectorAll('.edge')) EDGES.get(el.dataset.id).len = el.getTotalLength()
  shown = []
  svg.querySelectorAll('.tnode').forEach((g) => {
    const id = g.dataset.id
    g.addEventListener('click', () => { current = id; render() })
    g.addEventListener('mouseenter', () => { clearTimeout(clearTimer); highlight(routeOf(id)) })
    g.addEventListener('mousemove', (e) => showTip(e, PLACED.get(id).u))
    g.addEventListener('mouseleave', () => { tip.hidden = true; clearTimer = setTimeout(clearHighlight, 120) })
  })
}

// ---------- hover highlight: grows from the start along the path ----------
const EDGES = new Map()
const MODES = ['荧光笔', '加粗', '描边', '轨迹']
let mode = 1, shown = [], anim = null, clearTimer = 0
function routeOf(id) {
  const ids = []
  for (let cur = PLACED.get(id); cur; cur = cur.u.parent ? PLACED.get(cur.u.parent) : null) ids.unshift(cur.u.id)
  return ids
}
function clearHighlight() {
  const svg = stage.querySelector('svg')
  svg.querySelector('#under').innerHTML = ''
  svg.querySelector('#over').innerHTML = ''
  svg.querySelectorAll('.tnode.lit').forEach((g) => g.classList.remove('lit'))
  anim?.cancel()
  shown = []
}
function highlight(route) {
  const svg = stage.querySelector('svg'), under = svg.querySelector('#under'), over = svg.querySelector('#over')
  const mpath = svg.querySelector('#reveal-path')
  // The part shared with what's already shown stays; only the rest grows.
  let k = 0
  while (k < route.length && k < shown.length && route[k] === shown[k]) k++
  const segs = route.slice(1).map((id) => EDGES.get(id))
  const total = segs.reduce((a, s) => a + s.len, 0)
  const cum = [0]
  for (const s of segs) cum.push(cum[cum.length - 1] + s.len)
  const pre = cum[Math.max(0, k - 1)]
  let u = '', o = ''
  for (const s of segs) {
    if (mode === 0) u += `<path d="${s.d}" fill="none" stroke="var(--band)" stroke-width="15" stroke-linecap="round"/>`
    if (mode === 1) o += `<path d="${s.d}" fill="none" stroke="${s.stroke}" stroke-width="4.5" stroke-linecap="round"/>`
    if (mode === 2) {
      u += `<path d="${s.d}" fill="none" stroke="var(--casing)" stroke-width="8" stroke-linecap="round"/>`
      o += `<path d="${s.d}" fill="none" stroke="${s.stroke}" stroke-width="4" stroke-linecap="round"/>`
    }
    if (mode === 3) o += `<path d="${s.d}" transform="translate(0 -10)" fill="none" stroke="${s.stroke}" stroke-width="2" stroke-dasharray="0.1 5" stroke-linecap="round"/>`
  }
  if (!segs.length && mode === 0) {
    const p = svg.querySelector(`.tnode[data-id="${route[0]}"]`).getAttribute('transform').match(/[-\d.]+/g)
    u = `<circle cx="${p[0]}" cy="${p[1]}" r="7.5" fill="var(--band)"/>`
  }
  under.innerHTML = u
  over.innerHTML = o
  mpath.setAttribute('d', segs.map((s) => s.d).join(' ') || `M0 0`)
  anim?.cancel()
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  const dur = reduce ? 0 : Math.min(300, (total - pre) / 3.5)
  mpath.style.strokeDasharray = `${total + 1} ${total + 60}`
  anim = mpath.animate([{ strokeDashoffset: total - pre }, { strokeDashoffset: 0 }], { duration: dur, easing: 'linear', fill: 'forwards' })
  // In the bold mode the circles swell as the line reaches them.
  svg.querySelectorAll('.tnode.lit').forEach((g) => g.classList.remove('lit'))
  if (mode === 1) route.forEach((id, i) => {
    const g = svg.querySelector(`.tnode[data-id="${id}"]`)
    const delay = total > pre && cum[i] > pre ? ((cum[i] - pre) / (total - pre)) * dur : 0
    g.style.setProperty('--delay', delay + 'ms')
    g.classList.add('lit')
  })
  shown = route
}

function depthOf(id) { let d = 0, cur = BY_ID.get(id); while (cur.parent) { d++; cur = BY_ID.get(cur.parent) } return d }
function showTip(e, u) {
  let text = `第 ${depthOf(u.nodes[0].id) + 1} 轮`
  if (u.type === 'stack') text += ` · ${u.nodes.length} 个尝试`
  else {
    const branches = kids(u.id).filter((n) => n.k === 'b').length
    if (branches >= 2) text += ` · 分出 ${branches} 个分支`
  }
  tip.textContent = text
  tip.hidden = false
  const r = tip.getBoundingClientRect()
  tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 8) + 'px'
  tip.style.top = Math.min(e.clientY + 14, innerHeight - r.height - 8) + 'px'
}

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render)
render()
</script>
